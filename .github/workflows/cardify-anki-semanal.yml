name: Cardify - Anki semanal

# RFC-001 §5.7: a suíte .apkg roda toda semana contra o Anki mais recente do PyPI, não só contra a versão fixada.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  apkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: cardify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cardify/tools/anki/requirements.txt

      - name: Preparar Anki (mais recente)
        env:
          ANKI_VERSAO: latest
        run: bash tools/anki/preparar.sh

      - name: Versão do Anki instalada
        id: versao
        if: always()
        run: echo "versao=$(tools/anki/.venv/bin/python -c 'import anki.buildinfo as b; print(b.version)' 2>/dev/null || echo desconhecida)" >> "$GITHUB_OUTPUT"

      - name: Suíte .apkg (RFC-001 §9)
        run: npm run test:apkg

      - name: Abrir issue se falhou
        if: failure()
        uses: actions/github-script@v7
        env:
          VERSAO_ANKI: ${{ steps.versao.outputs.versao }}
        with:
          script: |
            const titulo = 'Suíte .apkg falhou contra o Anki mais recente';
            const { owner, repo } = context.repo;

            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            if (abertas.some((issue) => !issue.pull_request && issue.title === titulo)) {
              core.notice(`Já existe issue aberta com o título "${titulo}". Nenhuma issue nova.`);
              return;
            }

            const execucao = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: titulo,
              body: [
                'A execução semanal de `npm run test:apkg` falhou contra o Anki mais recente do PyPI.',
                '',
                `- Versão do Anki instalada: \`${process.env.VERSAO_ANKI || 'desconhecida'}\``,
                `- Execução: ${execucao}`,
                '',
                'Verificar se o formato do .apkg ou a importação mudou (RFC-001 §5.7). Só fixar outra versão em `cardify/tools/anki/requirements.txt` depois de entender a causa.',
              ].join('\n'),
            });
