name: Cardify

on:
  push:
    paths:
      - 'cardify/**'
      - '.github/workflows/cardify*.yml'
  pull_request:
    paths:
      - 'cardify/**'
      - '.github/workflows/cardify*.yml'

permissions:
  contents: read

concurrency:
  group: cardify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cardify

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit
        run: npm test

      - name: Build web
        run: npm run -w @cardify/web build

  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cardify_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      minio:
        # Mesma imagem do docker-compose.yml (2025.7.x não sobe aqui).
        image: bitnamilegacy/minio:2025.4.22-debian-12-r2
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # 9100 no host: a suíte de storage usa S3_ENDPOINT_TEST padrão http://localhost:9100.
        ports:
          - 9100:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/cardify_test
      S3_ENDPOINT_TEST: http://localhost:9100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardify/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A suíte .apkg roda no job "apkg" (precisa do Python/Anki). `vitest --exclude` não serve aqui:
      # o `exclude` do projeto int sobrescreve o da CLI, então listamos os arquivos explicitamente.
      - name: Integration (sem .apkg)
        run: |
          mapfile -t arquivos < <(find libs apps tools -name '*.int.test.ts' -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.venv/*' -not -path 'libs/apkg/*' | sort)
          test "${#arquivos[@]}" -gt 0 || { echo "nenhum teste de integração encontrado" >&2; exit 1; }
          npx vitest run --project int "${arquivos[@]}"

  apkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cardify/tools/anki/requirements.txt

      - name: Preparar Anki (versão fixada)
        run: bash tools/anki/preparar.sh

      - name: Suíte .apkg (RFC-001 §9)
        run: npm run test:apkg

  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cardify/package-lock.json

      - name: npm audit (produção, high+)
        run: npm audit --omit=dev --audit-level=high

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build api
        run: docker build --build-arg APP=api -t cardify-api:ci .

      - name: Build worker
        run: docker build --build-arg APP=worker -t cardify-worker:ci .
